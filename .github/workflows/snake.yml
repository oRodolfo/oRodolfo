name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: oRodolfo
          outputs: dist/snake-dark.svg
          # cor da cobra
          color_snake: "#22c55e"
          # paleta dark (fundo + 4 intensidades)
          color_dots: "#161B22,#0e4429,#006d32,#26a641,#39d353"

      - name: Publicar no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
